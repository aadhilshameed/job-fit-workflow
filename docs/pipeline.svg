<svg xmlns="http://www.w3.org/2000/svg" width="800" height="920" viewBox="0 0 800 920" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="800" height="920" fill="#ffffff"/>

  <!-- trigger -->
  <rect x="215" y="16" width="370" height="32" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="400" y="37" text-anchor="middle" font-size="13" fill="#24292f">AWS Lambda runs it at 08:00, 13:00 and 20:00 (Berlin)</text>
  <line x1="400" y1="48" x2="400" y2="62" stroke="#57606a" stroke-width="1.5"/>

  <!-- sources -->
  <g font-size="13" fill="#24292f">
    <rect x="40" y="72" width="220" height="70" rx="10" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="150" y="100" text-anchor="middle" font-weight="600" font-size="14">Arbeitsagentur</text>
    <text x="150" y="121" text-anchor="middle" fill="#57606a">Germany's public job search</text>
    <rect x="290" y="72" width="220" height="70" rx="10" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="400" y="100" text-anchor="middle" font-weight="600" font-size="14">Arbeitnow</text>
    <text x="400" y="121" text-anchor="middle" fill="#57606a">newest jobs in Germany</text>
    <rect x="540" y="72" width="220" height="70" rx="10" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="650" y="100" text-anchor="middle" font-weight="600" font-size="14">Company job boards</text>
    <text x="650" y="121" text-anchor="middle" fill="#57606a">Greenhouse, Lever, Ashby,</text>
    <text x="650" y="136" text-anchor="middle" fill="#57606a" font-size="12">Personio, SmartRecruiters</text>
  </g>
  <g stroke="#57606a" stroke-width="1.5" fill="none">
    <path d="M150,142 C150,165 390,160 397,174"/>
    <line x1="400" y1="142" x2="400" y2="174"/>
    <path d="M650,142 C650,165 410,160 403,174"/>
  </g>

  <!-- steps: number, title, line, what is dropped -->
  <g font-size="13" fill="#24292f">
    <!-- 1 -->
    <rect x="170" y="182" width="420" height="64" rx="10" fill="#f6f8fa" stroke="#8c959f"/>
    <circle cx="198" cy="214" r="14" fill="#57606a"/><text x="198" y="219" text-anchor="middle" fill="#fff" font-weight="600">1</text>
    <text x="224" y="208" font-weight="600" font-size="14">Skip already seen postings</text>
    <text x="224" y="228" fill="#57606a">from the same or another source</text>
    <!-- 2 -->
    <rect x="170" y="276" width="420" height="64" rx="10" fill="#f6f8fa" stroke="#8c959f"/>
    <circle cx="198" cy="308" r="14" fill="#57606a"/><text x="198" y="313" text-anchor="middle" fill="#fff" font-weight="600">2</text>
    <text x="224" y="302" font-weight="600" font-size="14">Title filter</text>
    <text x="224" y="322" fill="#57606a">title keyword check code: does the title sound like AI work?</text>
    <!-- 3 -->
    <rect x="170" y="370" width="420" height="64" rx="10" fill="#fbefff" stroke="#c297ff"/>
    <circle cx="198" cy="402" r="14" fill="#8250df"/><text x="198" y="407" text-anchor="middle" fill="#fff" font-weight="600">3</text>
    <text x="224" y="396" font-weight="600" font-size="14">Decisions API check (OpenAI)</text>
    <text x="224" y="416" fill="#57606a">AI engineering? role focus? office days a week?</text>
    <!-- 4 -->
    <rect x="170" y="464" width="420" height="64" rx="10" fill="#dafbe1" stroke="#4ac26b"/>
    <circle cx="198" cy="496" r="14" fill="#1a7f37"/><text x="198" y="501" text-anchor="middle" fill="#fff" font-weight="600">4</text>
    <text x="224" y="490" font-weight="600" font-size="14">Location rule (code)</text>
    <text x="224" y="510" fill="#57606a">can I reach the office from home often enough?</text>
    <!-- 5 -->
    <rect x="170" y="558" width="420" height="64" rx="10" fill="#fbefff" stroke="#c297ff"/>
    <circle cx="198" cy="590" r="14" fill="#8250df"/><text x="198" y="595" text-anchor="middle" fill="#fff" font-weight="600">5</text>
    <text x="224" y="584" font-weight="600" font-size="14">Requirement check (Claude Haiku)</text>
    <text x="224" y="604" fill="#57606a">each requirement vs. my background, with a quote</text>
    <!-- 6 -->
    <rect x="170" y="652" width="420" height="64" rx="10" fill="#dafbe1" stroke="#4ac26b"/>
    <circle cx="198" cy="684" r="14" fill="#1a7f37"/><text x="198" y="689" text-anchor="middle" fill="#fff" font-weight="600">6</text>
    <text x="224" y="678" font-weight="600" font-size="14">Verdict (code)</text>
    <text x="224" y="698" fill="#57606a">apply · stretch · lack of info · skip</text>
    <!-- 7 -->
    <rect x="170" y="746" width="420" height="64" rx="10" fill="#fff8c5" stroke="#d4a72c"/>
    <circle cx="198" cy="778" r="14" fill="#9a6700"/><text x="198" y="783" text-anchor="middle" fill="#fff" font-weight="600">7</text>
    <text x="224" y="772" font-weight="600" font-size="14">Summary (Claude Haiku) and Telegram</text>
    <text x="224" y="792" fill="#57606a">only apply, stretch, lack of info: summary, gaps, link</text>
  </g>

  <!-- arrows between steps -->
  <g stroke="#57606a" stroke-width="1.5">
    <line x1="380" y1="246" x2="380" y2="268"/>
    <line x1="380" y1="340" x2="380" y2="362"/>
    <line x1="380" y1="434" x2="380" y2="456"/>
    <line x1="380" y1="528" x2="380" y2="550"/>
    <line x1="380" y1="622" x2="380" y2="644"/>
    <line x1="380" y1="716" x2="380" y2="738"/>
  </g>

  <!-- dropped -->
  <g stroke="#afb8c1" stroke-width="1.5">
    <line x1="590" y1="214" x2="618" y2="214"/>
    <line x1="590" y1="308" x2="618" y2="308"/>
    <line x1="590" y1="402" x2="618" y2="402"/>
    <line x1="590" y1="496" x2="618" y2="496"/>
    <line x1="590" y1="684" x2="618" y2="684"/>
  </g>
  <g font-size="12.5" fill="#6e7781">
    <text x="626" y="218">dropped</text>
    <text x="626" y="312">dropped</text>
    <text x="626" y="406">dropped if not AI work</text>
    <text x="626" y="500">dropped if too far</text>
    <text x="626" y="682">skip: saved,</text>
    <text x="626" y="697">not sent</text>
  </g>

  <!-- legend, left -->
  <g font-size="12" fill="#57606a">
    <rect x="40" y="380" width="12" height="12" rx="3" fill="#fbefff" stroke="#c297ff"/><text x="58" y="390">paid model call</text>
    <rect x="40" y="402" width="12" height="12" rx="3" fill="#dafbe1" stroke="#4ac26b"/><text x="58" y="412">plain code rule</text>
    <rect x="40" y="424" width="12" height="12" rx="3" fill="#f6f8fa" stroke="#8c959f"/><text x="58" y="434">free filter</text>
  </g>

    <polygon points="394,62 406,62 400,70" fill="#57606a"/>
  <polygon points="394,172 406,172 400,180" fill="#57606a"/>
  <polygon points="374,266 386,266 380,274" fill="#57606a"/>
  <polygon points="374,360 386,360 380,368" fill="#57606a"/>
  <polygon points="374,454 386,454 380,462" fill="#57606a"/>
  <polygon points="374,548 386,548 380,556" fill="#57606a"/>
  <polygon points="374,642 386,642 380,650" fill="#57606a"/>
  <polygon points="374,736 386,736 380,744" fill="#57606a"/>
  <polygon points="611,209 611,219 619,214" fill="#afb8c1"/>
  <polygon points="611,303 611,313 619,308" fill="#afb8c1"/>
  <polygon points="611,397 611,407 619,402" fill="#afb8c1"/>
  <polygon points="611,491 611,501 619,496" fill="#afb8c1"/>
  <polygon points="611,679 611,689 619,684" fill="#afb8c1"/>

  <!-- database -->
  <rect x="40" y="840" width="720" height="58" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-dasharray="5 4"/>
  <text x="400" y="864" text-anchor="middle" font-size="13.5" font-weight="600" fill="#24292f">Neon Postgres keeps everything</text>
  <text x="400" y="884" text-anchor="middle" font-size="12.5" fill="#57606a">postings, verdicts (skips too), every requirement, costs and a log of each run. A failed message is sent on the next run.</text>
</svg>
